<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayo's Trial</title>
    <!-- Link to external CSS file -->
    <link rel="stylesheet" href="styles.css">
    <!-- Import the Press Start 2P font from Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script type="text/javascript" id="MathJax-script" async
        src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
    </script>
</head>
<body>
    <div class="dark-overlay" style="display:none;"></div>
    <div class="container">
        <div class="image-container">
            <!-- Use a relative path for the local GIF file -->
            <img src="pictures/kayo_idle_1.gif" alt="GIF Image" class="gif" id="main-gif">
        </div>
        <div class="text-container">
            <p>Hello, this is this is...<br>Welcome to Kayo's Trial!!<br>Tell me who you are...<br>Who you are...</p>
        </div>
        <div class="buttons-container" id="buttons-container">
            <!-- Buttons will be dynamically added here -->
        </div>
    </div>
	<div class="final-message-container"></div>
    <div class="hidden-message-container" id="hidden-message-container" style="display:none;">
        Congratulation!<br>You solved:<br><br><span id="hidden-correct-answers"></span>/<span id="hidden-total-questions"></span><br><br>question(s) correctly!
    </div>

    <!-- Add an audio element with autoplay -->
    <audio id="background-audio" src="audio/background.mp3" autoplay loop></audio>

    <!-- Link to external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
